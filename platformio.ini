[platformio]
default_envs = node_a, node_b

[esp32]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

[env:node_a]
extends = esp32
build_flags = -DAPD_NODE_ID=1

[env:node_b]
extends = esp32
build_flags = -DAPD_NODE_ID=2

[env:native]
platform = native
test_framework = unity
test_filter = test_native_*
