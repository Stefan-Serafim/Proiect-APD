name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - dev-ops

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install ESP-IDF 5.5.5
        run: |
          git clone --depth 1 --branch v5.5.5 --recurse-submodules --shallow-submodules https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32
      - name: Build both nodes and their SPIFFS images
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          idf.py -B build/node_a -D APD_NODE=a build
          idf.py -B build/node_b -D APD_NODE=b build
          grep -Fx 'CONFIG_APP_NODE_ID=1' build/node_a/sdkconfig.node_a
          grep -Fx 'CONFIG_APP_NODE_ID=2' build/node_b/sdkconfig.node_b
          test -s build/node_a/www.bin
          test -s build/node_b/www.bin
      - name: Run native Unity tests
        run: |
          if compgen -G 'test/test_native_*/' > /dev/null; then
            python -m pip install platformio==6.2.0
            pio test -e native
          else
            echo 'No native Unity tests yet.'
          fi
