name: Open pull request

on:
  push:
    branches:
      - 'feature/**'
      - web1-chat-ui
      - feat/web2-client-diagnostics
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}

jobs:
  open-pr:
    if: >-
      (github.event_name == 'push' && github.event.deleted == false &&
      github.actor != github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'web1-chat-ui' || github.ref_name == 'feat/web2-client-diagnostics'))
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REVIEWER: dcirstoc34-ai
        run: |
          existing_pr=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open -f base=main -f head="$OWNER:$BRANCH" \
            --jq '.[0].html_url // ""')
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request already open $existing_pr"
            exit 0
          fi

          encoded_branch=$(jq -rn --arg branch "$BRANCH" '$branch | @uri')
          has_changes=$(gh api "repos/$GH_REPO/compare/main...$encoded_branch" \
            --jq '.ahead_by > 0 and (.files | length > 0)')
          if [[ "$has_changes" != true ]]; then
            echo "No changes to propose to main."
            exit 0
          fi

          title="${BRANCH#feature/}"
          title="${title#feat/}"
          pr_number=$(gh api "repos/$GH_REPO/pulls" \
            -f base=main -f head="$BRANCH" -f title="${title//-/ }" \
            --jq '.number')
          echo "$GITHUB_SERVER_URL/$GH_REPO/pull/$pr_number"

          if [[ "$GITHUB_ACTOR" != "$REVIEWER" ]]; then
            gh api --method POST --silent "repos/$GH_REPO/pulls/$pr_number/requested_reviewers" \
              -f "reviewers[]=$REVIEWER"
          fi
